[package]
name = "license-generator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "license-generator"
path = "src/main.rs"

[lib]
name = "license_generator"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"
serde_json = "1"

[dependencies.serde]
version = "1"
features = ["derive"]
