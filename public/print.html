<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Receipt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1a1a1a; }
    .receipt { padding: 24px; max-width: 380px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 12px; color: #666; }
    .divider { border-top: 1px solid #ddd; margin: 12px 0; }
    .divider-thick { border-top: 2px solid #333; margin: 12px 0; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
    .label { color: #666; }
    .value { font-weight: 500; text-align: right; }
    .mono { font-family: 'Courier New', monospace; }
    .total-row { font-size: 18px; font-weight: 700; padding: 8px 0; }
    .total-row .value { color: #2563eb; }
    .footer { text-align: center; font-size: 11px; color: #999; margin-top: 24px; padding-top: 12px; border-top: 1px solid #ddd; }
    .notes { font-size: 12px; color: #666; margin: 8px 0; }
    @media print {
      @page { margin: 10mm; size: auto; }
      body { padding: 0; }
      .receipt { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="receipt" id="receipt"></div>
  <script>
    function renderReceipt(d) {
      const esc = s => { const el = document.createElement('span'); el.textContent = s || ''; return el.innerHTML; };
      document.getElementById('receipt').innerHTML = `
        <div class="header">
          <h1>${esc(d.gym_name)}</h1>
          ${d.gym_address ? `<p>${esc(d.gym_address)}</p>` : ''}
          ${d.gym_phone ? `<p>${esc(d.gym_phone)}</p>` : ''}
        </div>
        <div class="divider-thick"></div>
        <div class="row"><span class="label">Receipt #</span><span class="value mono">${esc(d.receipt_number)}</span></div>
        <div class="row"><span class="label">Date</span><span class="value">${esc(d.payment_date)}</span></div>
        <div class="divider"></div>
        <div class="row"><span class="label">Member</span><span class="value">${esc(d.member_name)}</span></div>
        <div class="row"><span class="label">Member #</span><span class="value mono">${esc(d.member_number)}</span></div>
        <div class="divider"></div>
        <div class="row"><span class="label">Plan</span><span class="value">${esc(d.plan_name)}</span></div>
        <div class="row"><span class="label">Period</span><span class="value">${esc(d.membership_start_date)} → ${esc(d.membership_expiry_date)}</span></div>
        <div class="divider-thick"></div>
        <div class="row"><span class="label">Payment Method</span><span class="value">${esc(d.payment_method)}</span></div>
        <div class="row total-row"><span class="label">Amount Paid</span><span class="value">Rs. ${Number(d.amount).toLocaleString('en-PK')}</span></div>
        ${d.remaining_balance > 0 ? `<div class="row" style="font-size:14px;font-weight:600;color:#ea580c;padding:4px 0;"><span class="label" style="color:#ea580c;">Remaining Balance</span><span class="value" style="color:#ea580c;">Rs. ${Number(d.remaining_balance).toLocaleString('en-PK')}</span></div>` : ''}
        ${d.notes ? `<div class="notes"><b>Notes:</b> ${esc(d.notes)}</div>` : ''}
        <div class="footer">Thank you for your payment!</div>
      `;
      document.title = `Receipt ${d.receipt_number}`;
      setTimeout(() => window.print(), 400);
    }
  </script>
</body>
</html>
